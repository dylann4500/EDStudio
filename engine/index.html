<!doctype html>
<!-- EDStudio render page. Loaded by tools/render.mjs as /engine/index.html?video=<folder-name>.
     Everything on screen = WebGL canvas (the 3D scene) + this HTML text overlay (title, tag, HUD, subtitles). -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Newsreader'; font-weight: 300; font-style: normal; src: url(/node_modules/@fontsource/newsreader/files/newsreader-latin-300-normal.woff2) format('woff2'); }
@font-face { font-family: 'Newsreader'; font-weight: 400; font-style: normal; src: url(/node_modules/@fontsource/newsreader/files/newsreader-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Newsreader'; font-weight: 400; font-style: italic; src: url(/node_modules/@fontsource/newsreader/files/newsreader-latin-400-italic.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 500; src: url(/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; src: url(/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2) format('woff2'); }

html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#ui { position: absolute; inset: 0; pointer-events: none; color: #fff; }

/* Title: serif, one keyword in gold via <em>. Keep it inside the top 25% (IG UI covers the bottom ~22%). */
.title { position: absolute; top: 170px; left: 60px; right: 60px; text-align: center;
  font-family: 'Newsreader'; font-weight: 300; font-size: 74px; line-height: 1.13; letter-spacing: -0.005em;
  text-shadow: 0 1px 3px rgba(0,0,0,.5), 0 0 16px rgba(0,0,0,.3); }
.title em { font-style: normal; color: #f3c46b; }
.tag { position: absolute; top: 380px; left: 0; right: 0; text-align: center; }
.tag span { display: inline-block; font-family: 'Inter'; font-weight: 600; font-size: 21px; letter-spacing: .22em;
  padding: 9px 18px 8px 22px; background: rgba(20,16,14,.55); border-radius: 4px; color: rgba(255,255,255,.88); }

/* HUD: compact, top-left, out of the action. Dims when idle; brightens when the number changes (core.js). */
.hud { position: absolute; left: 64px; top: 468px; font-family: 'Inter';
  text-shadow: 0 1px 3px rgba(0,0,0,.55), 0 0 10px rgba(0,0,0,.3); }
.hud .label { font-weight: 600; font-size: 16px; letter-spacing: .17em; color: rgba(255,255,255,.9); }
.hud .num { font-family: 'Newsreader'; font-weight: 300; font-size: 60px; line-height: 1.02; margin: 2px 0 4px -2px; transform-origin: left center; }
.hud .small { font-weight: 500; font-size: 14px; letter-spacing: .15em; color: rgba(255,255,255,.8); line-height: 1.6; }
.hud .gold { color: #f3c46b; }

/* Subtitles: small italic serif, lower third, subtle shadow (like the reference accounts). */
.sub { position: absolute; top: 1340px; left: 80px; right: 80px; text-align: center;
  font-family: 'Newsreader'; font-style: italic; font-weight: 400; font-size: 40px; line-height: 1.25;
  text-shadow: 0 1px 3px rgba(0,0,0,.6), 0 0 12px rgba(0,0,0,.28); }

#fade { position: absolute; inset: 0; background: #000; opacity: 0; }
.end { position: absolute; top: 820px; left: 80px; right: 80px; text-align: center;
  font-family: 'Newsreader'; font-weight: 300; font-size: 70px; line-height: 1.15; opacity: 0; }
.end em { font-style: normal; color: #f3c46b; }
.end .small { display: block; margin-top: 34px; font-family: 'Inter'; font-weight: 600; font-size: 22px; letter-spacing: .2em; color: rgba(255,255,255,.7); }
</style>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/",
    "@engine/": "/engine/"
} }
</script>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="ui">
  <div class="title" id="title"></div>
  <div class="tag" id="tag"><span></span></div>
  <div class="hud" id="hud">
    <div class="label" id="hudLabel"></div>
    <div class="num" id="hudNum"></div>
    <div class="small" id="hudTime"></div>
    <div class="small" id="hudAge"></div>
  </div>
  <div class="sub" id="sub"></div>
  <div id="fade"></div>
  <div class="end" id="end"></div>
</div>
<script type="module" src="/engine/main.js"></script>
</body>
</html>
